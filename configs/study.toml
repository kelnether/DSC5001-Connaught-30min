name = "study"
title = "干诺道西及西天桥 · 检测点级提前 30 分钟平均车速预测"
status = "六周候选正式实验"
input = "data/raw/study/lane_observations.csv.gz"
detectors = "data/reference/detectors.csv"
manifest = "data/provenance/study_archive_manifest.json"
extraction_audit = "data/provenance/study_extraction_audit.json"
output = "results/study"
start = "2026-09-21"
test_start = "2026-10-19"
end_exclusive = "2026-11-02"
# 同一检测点目标箱的均速；流量与占用率是输入。 / Target: mean speed at one detector. Flow and occupancy are inputs.
bin_minutes = 5
horizon_minutes = 30
# 车道数用于覆盖率。原型中车道速度差的收益小且不稳定，主模型预测点位均速。
# Lane count determines coverage. Small and inconsistent pilot gains kept lane-gap inputs out of the primary detector model.
min_coverage = 0.60
seed = 42
ridge_alphas = [1.0, 10.0, 100.0]
forest_leaf_sizes = [15, 35]
forest_trees = 120

[[validation]]
start = "2026-10-05"
end = "2026-10-12"

[[validation]]
start = "2026-10-12"
end = "2026-10-19"
