[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connaught-traffic-forecast"
version = "0.1.0"
description = "DSC5001 30-minute-ahead forecasting of vehicle-weighted mean speed at individual detectors"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
]

[project.scripts]
connaught = "connaught.cli:main"

[project.optional-dependencies]
notebook = ["ipykernel>=6,<8", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]
